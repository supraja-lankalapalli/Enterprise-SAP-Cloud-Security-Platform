<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SL Cloud Technologies</h1>
    <p>Enterprise SAP Cloud Security Platform</p>
</header>

<div class="dashboard">

    <h2>Security Administration Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Departments</h3>
            <p>8 Business Units</p>
        </div>

        <div class="card">
            <h3>SAP Users</h3>
            <p>1,250 Active Users</p>
        </div>

        <div class="card">
            <h3>AWS IAM Users</h3>
            <p>235 IAM Identities</p>
        </div>

        <div class="card">
            <h3>Pending Requests</h3>
            <p>18 Access Requests</p>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
